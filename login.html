<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoHabit – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
  <style>
    /* Custom Styling Spesifik untuk halaman Wireframe Login */
    .login-container {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background-color: #f3f5ef; /* Soft cream base */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }

    /* Background Abstract Shapes */
    .shape-top-right {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 70%;
      background: #abbca7;
      border-bottom-left-radius: 60% 80%;
      opacity: 0.7;
      z-index: 1;
    }

    .shape-bottom-left {
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 450px;
      height: 450px;
      background: transparent;
      border: 60px solid #abbca7;
      border-radius: 50%;
      opacity: 0.6;
      z-index: 1;
    }

    .shape-bottom-left-inner {
      position: absolute;
      bottom: -50px;
      left: -50px;
      width: 300px;
      height: 300px;
      background: transparent;
      border: 40px solid #7d8f79;
      border-radius: 50%;
      opacity: 0.5;
      z-index: 1;
    }

    /* Login Card */
    .login-card {
      position: relative;
      z-index: 10;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .login-card h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a2018;
      margin-bottom: 28px;
    }

    /* Input Styling */
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: #1a73e8;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: #666;
      text-decoration: none;
      margin-top: -10px;
      margin-bottom: 24px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Blue Wireframe Button */
    .btn-submit-login {
      width: 100%;
      background: #0d6efd; /* Vibrant Blue from wireframe */
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 28px;
    }

    .btn-submit-login:hover {
      background: #0b5ed7;
    }

    /* Divider */
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #888;
      font-size: 0.8rem;
      margin-bottom: 24px;
    }

    .or-divider::before,
    .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }

    .or-divider:not(:empty)::before { margin-right: .5em; }
    .or-divider:not(:empty)::after { margin-left: .5em; }

    /* Social Login Buttons */
    .social-row {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid #f0f0f0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .social-btn:hover {
      transform: scale(1.05);
    }
    
    .back-home {
      display: inline-block;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #0d6efd;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="shape-top-right"></div>
    <div class="shape-bottom-left"></div>
    <div class="shape-bottom-left-inner"></div>

    <div class="login-card">
      <h2>Login</h2>
      <form action="#" method="POST" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="input-group">
          <input type="text" placeholder="Username" required />
        </div>
        <div class="input-group">
          <input type="password" placeholder="Password" required />
        </div>
        <a href="#" class="forgot-link">Forgot Password ?</a>
        
        <button type="submit" class="btn-submit-login">Login</button>
      </form>

      <div class="or-divider">Or Sign up With</div>

      <div class="social-row">
        <button class="social-btn" title="Google">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.53-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-8.83z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.11 0-5.74-2.11-6.68-4.96H1.21v3.15C3.18 21.88 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.32 14.24A7.16 7.16 0 0 1 4.91 12c0-.79.13-1.57.38-2.31V6.54H1.21A11.94 11.94 0 0 0 0 12c0 1.92.45 3.74 1.21 5.46l4.11-3.22z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.18 2.12 1.21 5.46l4.11 3.22c.94-2.85 3.57-4.93 6.68-4.93z"/>
          </svg>
        </button>
        <button class="social-btn" title="Facebook">
          <svg width="22" height="22" fill="#1877F2" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>
        <button class="social-btn" title="Apple">
          <svg width="20" height="20" fill="#000000" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.7-1.13 1.84-.99 2.94 1.07.08 2.16-.52 2.82-1.33z"/>
          </svg>
        </button>
      </div>

      <a href="index.html" class="back-home">← Kembali ke Beranda</a>
    </div>
  </div>

</body>
</html>
